# Bij elke push en elk updatevoorstel: types controleren en de app bouwen.
# Mislukt dit, dan wordt een update niet samengevoegd.
name: Controle
on:
  push:
    branches: [main, test]
  pull_request:
jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://voorbeeld.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: controle
