<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<title>The Ark 50×30 – WK Veldrijden 2027 Hippodroom Oostende</title>
<style>
/* VOICE: event-mockup voor het WK veldrijden, zelfde viewer als de strandtent
   IDEA: renderviewer zoals een standbouwer die toont
   PICTURE: de volledige 3D-scène, schermvullend
   COLOUR and TYPE: amber #e9a44a op donker espresso; Montserrat
   LAYOUT: canvas fullscreen, één compacte knoppenrij onderaan */
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#120a06;font:13px/1.3 Montserrat,system-ui,sans-serif}
#app{position:fixed;inset:0}#app canvas{display:block;touch-action:none}
.hud{position:fixed;left:10px;top:10px;color:#fff;background:rgba(30,16,8,.72);backdrop-filter:blur(6px);padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px;letter-spacing:.02em}
.hud span{color:#e9a44a}
.hud small{display:block;font-weight:600;font-size:11px;opacity:.75;letter-spacing:0;margin-top:2px}
.bar{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;background:rgba(30,16,8,.78);backdrop-filter:blur(6px);padding:4px;border-radius:10px;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;font:700 12px Montserrat,sans-serif;color:#fff;background:transparent;border:0;border-radius:7px;height:32px;padding:0 10px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.12)}
.bar button.on{background:#e9a44a;color:#2a1608}
.bar button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.mode{position:fixed;right:10px;top:10px;color:#2a1608;background:#e9a44a;padding:5px 9px;border-radius:8px;font-weight:800;font-size:11px}
.sep{flex:none;width:1px;background:rgba(255,255,255,.2);margin:6px 2px}
#shot{position:fixed;inset:0;background:rgba(15,8,4,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:5;color:#fff;text-align:center}
#shot.show{display:flex}
#shot img{max-width:100%;max-height:78vh;border-radius:6px}
#shot button{font:700 13px Montserrat;height:36px;padding:0 16px;border-radius:8px;border:0;cursor:pointer;background:#e9a44a;color:#2a1608}
.chk{flex:none;display:flex;align-items:center;gap:6px;font:700 12px Montserrat,sans-serif;color:#fff;padding:0 10px;height:32px;border-radius:7px;cursor:pointer;white-space:nowrap}
.chk:hover{background:rgba(255,255,255,.12)}
.chk input{accent-color:#e9a44a;width:15px;height:15px;margin:0}
#areainfo{position:fixed;right:10px;top:42px;max-width:300px;color:#fff;background:rgba(30,16,8,.82);backdrop-filter:blur(6px);padding:8px 11px;border-radius:8px;display:flex;flex-direction:column;gap:3px}
#areainfo[hidden]{display:none}
#areainfo b{font-weight:800;font-size:14px}
#areainfo span{font-weight:700;font-size:12px;color:#e9a44a}
#areainfo small{font-weight:600;font-size:11px;opacity:.7}
@media (max-width:600px){
 .hud{font-size:11px;padding:5px 8px}.hud small{font-size:10px}
 .mode{font-size:10px;padding:4px 7px}
 #areainfo{left:10px;right:10px;top:auto;bottom:62px;max-width:none}
 .bar{left:8px;right:8px;transform:none;max-width:none}
 .bar button,.chk{height:38px}
}
</style></head><body><div id="app"></div>
<div class="mode" id="mode">Avond</div>
<div class="hud">WK OOSTENDE · <span>THE ARK HIPPODROOM</span><small>Tent 50 × 30,5 m · nok 14,84 m · houten spanten</small></div>
<div class="bar">
  <button data-v="buiten">Overzicht</button>
  <button data-v="gevel">Gevel</button>
  <button data-v="ingang">Ingang</button>
  <button data-v="binnen">Binnen</button>
  <button data-v="bar">Bar</button>
  <button data-v="foh">FOH</button>
  <button data-v="dj">DJ</button>
  <button data-v="zij">Boven</button>
  <button data-v="plan">Opstelling</button>
  <span class="sep"></span>
  <button id="dag">Dag</button>
  <button id="show">Lichtshow</button>
  <button id="haze" class="on">Haze</button>
  <button id="muz" title="Muziek speelt zodra je in de tent bent">♪ Muziek</button>
  <label class="chk"><input type="checkbox" id="area">Publieksruimte</label>
  <button id="png">Render</button>
</div>
<div id="areainfo" hidden></div>
<div id="shot"><img alt="Render van de scène"><span>Rechtsklik of lang drukken → Afbeelding opslaan</span><button id="close">Sluiten</button></div>
